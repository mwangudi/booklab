# Booklab Bookshop — Nginx vhost (HTTP). Certbot adds the TLS (443) block on first run.
# Serves the built SPA and reverse-proxies /api to the Fastify service on 127.0.0.1:4100.
# Co-exists with the other sites on this host — Nginx routes by server_name.

server {
    listen 80;
    listen [::]:80;
    server_name booklab.localinvestors.co.ke;

    root /var/www/booklab/frontend/dist;
    index index.html;

    # Upload cap for POST bodies (forms).
    client_max_body_size 5m;

    # API → Fastify (keeps the /api prefix; backend routes are mounted under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets — cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell so new deploys load fresh asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA client-side routing fallback — never cache the HTML shell so new
    # deploys (new asset hashes) are always picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
