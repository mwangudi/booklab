# Booklab Bookshop — Nginx vhost (HTTP). Certbot adds the TLS (443) block on first run.
# Serves the built SPA and reverse-proxies /api to the Fastify service on 127.0.0.1:4100.
# Co-exists with the other sites on this host — Nginx routes by server_name.
#
# snippets/booklab-security.conf is included in EVERY block on purpose — read the
# comment at the top of that file before removing any of them.

server {
    listen 80;
    listen [::]:80;
    server_name booklab.localinvestors.co.ke;

    root /var/www/booklab/frontend/dist;
    index index.html;

    # Upload cap for POST bodies (forms, promo pictures).
    client_max_body_size 5m;

    include snippets/booklab-security.conf;

    # API → Fastify (keeps the /api prefix; backend routes are mounted under /api).
    location /api/ {
        include snippets/booklab-security.conf;

        # Fastify runs helmet too (a branch laptop has no nginx in front of it),
        # but its defaults differ from ours. Drop the upstream copies so there is
        # exactly one, authoritative set of these headers on an API response.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets — cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include snippets/booklab-security.conf;
    }

    # Never cache the HTML shell so new deploys load fresh asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/booklab-security.conf;
    }

    # Not in nginx's mime.types, so it would otherwise be served as
    # octet-stream and the install prompt would never appear.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/booklab-security.conf;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/booklab-security.conf;
    }

    # SPA client-side routing fallback — never cache the HTML shell so new
    # deploys (new asset hashes) are always picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/booklab-security.conf;
    }
}
