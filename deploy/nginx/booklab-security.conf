# Security headers for the Booklab app.
#
# READ THIS BEFORE EDITING: nginx only inherits `add_header` from an outer block
# when the inner block declares NO `add_header` of its own. Every location in the
# vhost sets Cache-Control, so putting these at server level alone would silently
# drop them from every response that matters. That is why this file exists and is
# included in each location as well as at server level.
#
# Verify after any change:
#   curl -sI https://booklab.localinvestors.co.ke/ | grep -i strict-transport
#   curl -sI https://booklab.localinvestors.co.ke/assets/<hashed>.js | grep -i x-frame

# Force HTTPS for a year. Safe because renewal is automated (certbot.timer) and
# `certbot renew --dry-run` passes for this domain. `preload` is deliberately
# NOT set — that is a one-way submission to a browser-vendor list.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Never let a browser second-guess a declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. The app is never legitimately framed by anyone, and receipt
# printing uses document.write/srcdoc iframes, which these do not affect.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# Don't leak which internal page a member of staff came from to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Hardware and APIs the app never uses.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
