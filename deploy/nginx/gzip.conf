# gzip for all sites on this droplet. Lives in the http block
# (/etc/nginx/conf.d/gzip.conf), so it applies to Booklab and pharma alike.
#
# nginx ships with `gzip on` but the type list commented out, which compresses
# only text/html — the JS bundle, by far the largest download, went uncompressed.
#
# Verify:  curl -I -H "Accept-Encoding: gzip" https://booklab.localinvestors.co.ke/
#          -> Content-Encoding: gzip

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-javascript
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/javascript
    text/plain
    text/xml;
