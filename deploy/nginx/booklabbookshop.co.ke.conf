# Booklab Bookshop — Nginx vhost for https://www.booklabbookshop.co.ke
# Serves the built SPA and reverse-proxies /api to the Fastify service on 127.0.0.1:4100.
# booklabbookshop.co.ke and plain HTTP redirect to https://www. Co-exists with the other
# sites on this host — Nginx routes by server_name.
# Certificate: certbot certonly --webroot -w /var/www/letsencrypt -d www.booklabbookshop.co.ke -d booklabbookshop.co.ke

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.booklabbookshop.co.ke;

    root /var/www/booklab/frontend/dist;
    index index.html;

    # Upload cap for POST bodies (forms).
    client_max_body_size 5m;

    include snippets/booklab-security.conf;

    # API → Fastify (keeps the /api prefix; backend routes are mounted under /api).
    location /api/ {
        include snippets/booklab-security.conf;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets — cache hard.
    location /assets/ {
        include snippets/booklab-security.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell so new deploys load fresh asset hashes.
    location = /index.html {
        include snippets/booklab-security.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        include snippets/booklab-security.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw.js {
        include snippets/booklab-security.conf;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA client-side routing fallback.
    location / {
        include snippets/booklab-security.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    ssl_certificate /etc/letsencrypt/live/www.booklabbookshop.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.booklabbookshop.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# booklabbookshop.co.ke → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name booklabbookshop.co.ke;

    ssl_certificate /etc/letsencrypt/live/www.booklabbookshop.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.booklabbookshop.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.booklabbookshop.co.ke$request_uri;
}

# Plain HTTP: certificate renewals, then everything to https://www.
server {
    listen 80;
    listen [::]:80;
    server_name www.booklabbookshop.co.ke booklabbookshop.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.booklabbookshop.co.ke$request_uri;
    }
}
